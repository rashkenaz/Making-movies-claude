:root {
  --ink: #3A3848; --body: #3A3A3A; --paper: #FCF6EC;
  --coral: #F7987D; --coral-l: #FDE3D8; --coral-d: #C46A5C;
  --blue: #90C6E9; --blue-l: #E2F1FB; --blue-d: #4A90B8;
  --green: #C0DFAE; --green-l: #E8F4E0; --green-d: #7BAA6C;
  --yellow: #FFF27A; --yellow-l: #FFF6C4;
  --chat-bg: #F3EEE6; --muted: #8C8797;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #E9E5DF; }
body { font-family: 'Varela Round', sans-serif; color: var(--body); -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
bdi { unicode-bidi: isolate; }
svg.i { width: 1em; height: 1em; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

#stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); transform-origin: 0 0; direction: rtl; }
.abs { position: absolute; left: 0; top: 0; }
.blob { position: absolute; border-radius: 50%; }
#grain { position: absolute; inset: 0; pointer-events: none; opacity: .07; mix-blend-mode: multiply; background-size: 256px 256px; z-index: 50; }

/* the phone */
#phone { position: absolute; left: 150px; top: 250px; width: 780px; height: 1310px; border-radius: 96px; background: #34323F;
  box-shadow: 0 40px 90px rgba(58, 56, 72, .22), inset 0 0 0 4px #4E4B5D; transform-origin: 50% 60%; }
#screen { position: absolute; left: 22px; top: 22px; right: 22px; bottom: 22px; border-radius: 76px; overflow: hidden; background: var(--chat-bg); }
#screen::before { content: ''; position: absolute; inset: 0; opacity: .5;
  background-image: radial-gradient(circle at 20px 20px, #E7DFD3 3px, transparent 4px), radial-gradient(circle at 60px 60px, #EADFD9 3px, transparent 4px);
  background-size: 80px 80px; }
#notch { position: absolute; left: 50%; top: 18px; width: 170px; height: 40px; margin-left: -85px; border-radius: 22px; background: #34323F; z-index: 6; }
#status { position: absolute; left: 0; right: 0; top: 0; height: 74px; display: flex; align-items: center; justify-content: space-between; padding: 14px 64px 0; font-size: 28px; color: var(--ink); background: #fff; z-index: 5; direction: ltr; }
#status .bat { width: 46px; height: 22px; border: 3px solid var(--ink); border-radius: 7px; position: relative; }
#status .bat::after { content: ''; position: absolute; left: 3px; top: 3px; bottom: 3px; width: 60%; background: var(--green-d); border-radius: 3px; }
#header { position: absolute; left: 0; right: 0; top: 74px; height: 128px; display: flex; align-items: center; gap: 22px; padding: 0 34px; background: #fff; border-bottom: 2px solid #ECE6DE; z-index: 5; }
#avatar { width: 84px; height: 84px; border-radius: 50%; background: var(--coral); color: #fff; font-size: 44px; display: grid; place-items: center; flex: none; }
#who { display: flex; flex-direction: column; gap: 4px; }
#who .name { font-size: 38px; color: var(--ink); }
#who .st { font-size: 27px; color: var(--muted); height: 34px; }
#who .st.typing { color: var(--green-d); }
#header .back { margin-inline-start: auto; font-size: 44px; color: var(--ink); transform: scaleX(-1); }

#view { position: absolute; left: 0; right: 0; top: 202px; bottom: 118px; overflow: hidden; }
#list { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; gap: 16px; padding: 28px 28px 30px; }
.day { align-self: center; font-size: 25px; color: var(--muted); background: #fff; border-radius: 18px; padding: 6px 18px; margin-bottom: 6px; }
.msg { max-width: 580px; padding: 18px 26px 12px; border-radius: 34px; font-size: 43px; line-height: 1.4; color: var(--body); box-shadow: 0 2px 0 rgba(58, 56, 72, .06); }
.msg.in { align-self: flex-start; background: #fff; border-start-start-radius: 10px; }
.msg.out { align-self: flex-end; background: var(--coral-l); border-start-end-radius: 10px; }
.msg .meta { display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 23px; color: var(--muted); margin-top: 2px; direction: ltr; }
.msg .ticks { width: 34px; height: 20px; }
.card { padding: 10px 10px 14px; width: 560px; }
.card .pv { height: 290px; border-radius: 24px; background: var(--coral-l); position: relative; overflow: hidden; display: grid; place-items: center; }
.card .pv .pvblob { position: absolute; border-radius: 50%; }
.card .ttl { font-size: 40px; color: var(--ink); padding: 18px 16px 4px; }
.card .dsc { font-size: 31px; color: var(--muted); padding: 0 16px; line-height: 1.35; }
.card .dom { font-size: 26px; color: var(--blue-d); padding: 10px 16px 0; direction: ltr; text-align: right; }

#inputbar { position: absolute; left: 0; right: 0; bottom: 0; height: 118px; display: flex; align-items: center; gap: 18px; padding: 0 24px 10px; background: var(--chat-bg); z-index: 5; }
#field { flex: 1; height: 84px; border-radius: 42px; background: #fff; display: flex; align-items: center; padding: 0 30px; font-size: 36px; color: var(--body); white-space: nowrap; overflow: hidden; }
#field .ph { color: #B7B0A6; }
#field .caret { display: inline-block; width: 3px; height: 40px; background: var(--coral-d); margin-inline-start: 2px; vertical-align: middle; }
#send { width: 84px; height: 84px; border-radius: 50%; background: var(--coral); color: #fff; display: grid; place-items: center; font-size: 40px; flex: none; }

/* the touch and the card leaving the phone */
#touch { position: absolute; left: 0; top: 0; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; background: rgba(58, 56, 72, .28); border: 4px solid rgba(255, 255, 255, .9); z-index: 20; }
#ripple { position: absolute; left: 0; top: 0; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; border: 6px solid var(--coral); z-index: 19; }
#expand { position: absolute; left: 0; top: 0; overflow: hidden; background: var(--coral-l); z-index: 30; display: grid; place-items: center; }
#expand .inner { display: flex; flex-direction: column; align-items: center; gap: 30px; transform-origin: 50% 50%; }
#expand .big { font-size: 120px; color: var(--ink); white-space: nowrap; }
#expand .sub { font-size: 60px; color: var(--coral-d); white-space: nowrap; }

#harness { position: fixed; left: 0; right: 0; bottom: 0; height: 54px; background: #222; display: flex; align-items: center; gap: 12px; padding: 0 14px; color: #fff; font: 14px monospace; direction: ltr; z-index: 100; }
#harness input { flex: 1; }
#harness button { background: #4E4B5D; color: #fff; border: 0; border-radius: 6px; padding: 4px 12px; font-size: 16px; }
</style>
</head>

  const msgEls = MSGS.map((_, i) => $(`m${i}`));

  // ------------------------------------------------------------------ layout, measured once
  let LAY = null;
  function measure() {
    const viewH = el.view.clientHeight;
    const bottoms = msgEls.map((m) => m.offsetTop + m.offsetHeight + 30);
    const target = bottoms.map((b) => Math.max(0, b - viewH));
    LAY = { viewH, target };
  }
  const scrollAt = (t) => {
    let s = 0, prev = 0;
    MSGS.forEach((m, i) => { const d = LAY.target[i] - prev; prev = LAY.target[i]; s += d * clamp(sp(t, m.at - 0.05, SPR.scroll), 0, 1.04); });
    return s;
  };

  // phone-space to stage-space for the card (the phone is not transformed while the card is tapped)
  function cardRect(t) {
    const card = msgEls[MSGS.length - 1];
    const ph = el.phone, sc = $('screen');
    const x = ph.offsetLeft + sc.offsetLeft + el.view.offsetLeft + el.list.offsetLeft + card.offsetLeft;
    const y = ph.offsetTop + sc.offsetTop + el.view.offsetTop + card.offsetTop - scrollAt(t);
    return { x, y, w: card.offsetWidth, h: card.offsetHeight };
  }

  // ------------------------------------------------------------------ the frame
  function apply(t) {
    // background blobs drift slowly
    [['b1', 0.3, 40], ['b2', 0.25, 30], ['b3', 0.2, 36], ['b4', 0.35, 26]].forEach(([id, f, a], i) => {
      $(id).style.transform = `translate(${f1(a * Math.sin(t * f + i))}px, ${f1(a * Math.cos(t * f * 0.8 + i * 2))}px)`;
    });

    // the phone rises in, then gives way to the card
    const pin = sp(t, 0, SPR.phone);
    const away = EZ.io(prog(t, EXP0, EXP1));
    el.phone.style.transform = `translateY(${f1((1 - pin) * 700 + away * 60)}px) scale(${f3(0.96 + 0.04 * clamp(pin) - 0.08 * away)})`;
    el.phone.style.opacity = f2(clamp(pin * 2) * (1 - prog(t, EXP1 - 0.3, EXP1)));

    // messages pop in from their corner (spring), the list scrolls up under them
    MSGS.forEach((m, i) => {
      const e = msgEls[i];
      const k = sp(t, m.at, SPR.pop);
      const on = t >= m.at;
      e.style.visibility = on ? 'visible' : 'hidden';
      if (!on) return;
      e.style.transformOrigin = m.who === 'out' ? '0% 100%' : '100% 100%';
      e.style.transform = `translateY(${f1((1 - clamp(k)) * 26)}px) scale(${f3(0.82 + 0.18 * k)})`;
      e.style.opacity = f2(clamp(k * 2.2));
    });
    el.list.style.transform = `translateY(${f1(-scrollAt(t))}px)`;

    // the teacher types: status line in the header
    const typingIn = MSGS.find((m) => m.who === 'in' && t >= m.type && t < m.at);
    if (typingIn) {
      const n = 1 + Math.floor(((t - typingIn.type) * 3) % 3);
      el.st.textContent = 'מקלידה' + '.'.repeat(n);
      el.st.className = 'st typing';
    } else { el.st.textContent = 'מחוברת'; el.st.className = 'st'; }

    // the mother types in the input field, then sends (the send button pops)
    const typingOut = MSGS.find((m) => m.who === 'out' && t >= m.type && t < m.at);
    if (typingOut) {
      const txt = typingOut.text;
      const n = Math.round(txt.length * clamp((t - typingOut.type) / (typingOut.at - typingOut.type - 0.12)));
      const shown = txt.slice(Math.max(0, n - 26), n);
      el.field.innerHTML = `<span>${n > 26 ? '…' : ''}${shown}</span><span class="caret" style="opacity:${((t * 2.2) % 1) < 0.6 ? 1 : 0}"></span>`;
    } else el.field.innerHTML = '<span class="ph">הודעה</span>';
    let press = 0;
    MSGS.forEach((m) => { if (m.who === 'out') press = Math.max(press, Math.exp(-(((t - m.at + 0.04) / 0.07) ** 2))); });
    el.send.style.transform = `scale(${f3(1 - 0.16 * press)})`;

    // the tap on the link card
    const r = cardRect(Math.min(t, TAP));
    const tx = r.x + r.w * 0.5, ty = r.y + 150;
    const tin = sp(t, TAP - 0.45, SPR.ui), tout = 1 - prog(t, TAP + 0.15, TAP + 0.4);
    const touchOn = t > TAP - 0.45 && t < TAP + 0.4;
    el.touch.style.display = touchOn ? '' : 'none';
    if (touchOn) {
      const pressK = Math.exp(-(((t - TAP) / 0.08) ** 2));
      el.touch.style.transform = `translate(${f1(tx + (1 - tin) * 120)}px, ${f1(ty + (1 - tin) * 160)}px) scale(${f3(1 - 0.25 * pressK)})`;
      el.touch.style.opacity = f2(clamp(tin) * tout);
    }
    const rp = prog(t, TAP, TAP + 0.5);
    el.ripple.style.display = rp > 0 && rp < 1 ? '' : 'none';
    if (rp > 0 && rp < 1) { el.ripple.style.transform = `translate(${f1(tx)}px, ${f1(ty)}px) scale(${f3(1 + EZ.out(rp) * 2.2)})`; el.ripple.style.opacity = f2(1 - rp); }
    const cardPress = Math.exp(-(((t - TAP - 0.03) / 0.09) ** 2));
    if (t > TAP - 0.2 && t < EXP0) msgEls[MSGS.length - 1].style.transform = `scale(${f3(1 - 0.03 * cardPress)})`;

    // the card leaves the phone: it grows from its place in the chat to the whole frame
    const ex = EZ.expand(prog(t, EXP0, EXP1));
    const exOn = t >= EXP0;
    el.expand.style.display = exOn ? '' : 'none';
    msgEls[MSGS.length - 1].style.opacity = exOn ? '0' : msgEls[MSGS.length - 1].style.opacity;
    if (exOn) {
      const rr = cardRect(EXP0);
      const x = lerp(rr.x, 0, ex), y = lerp(rr.y, 0, ex), w = lerp(rr.w, SW, ex), h = lerp(rr.h, SH, ex);
      Object.assign(el.expand.style, { transform: `translate(${f1(x)}px, ${f1(y)}px)`, width: `${f1(w)}px`, height: `${f1(h)}px`, borderRadius: `${f1(34 * (1 - ex))}px` });
      const inner = el.expand.querySelector('.inner');
      const ik = sp(t, EXP0 + 0.5, SPR.pop);
      inner.style.transform = `scale(${f3(lerp(0.32, 1, ex) * (0.94 + 0.06 * clamp(ik)))})`;
      inner.style.opacity = f2(clamp(ex * 1.5));
      // the logo draws itself again once the card fills the frame
      const lg = $('exLogo');
      lg.querySelector('.lstroke').style.strokeDasharray = '1';
      lg.querySelector('.lstroke').style.strokeDashoffset = f3(1 - EZ.out(prog(t, EXP1 - 0.2, EXP1 + 1.0)));
      lg.querySelectorAll('.ld').forEach((d, i) => { d.style.transform = `scale(${f3(clamp(sp(t, EXP1 + 0.2 + i * 0.12, SPR.pop), 0, 1.3))})`; });
    }
  }

  // ------------------------------------------------------------------ sound on picture
  function hits() {
    const P = GRID.period, OFF = GRID.offset;
    const u = (s) => (s - OFF) / P;
    const H = [];
    const add = (s, label, sfx, o) => H.push([u(s), label, sfx, o]);
    add(0.05, 'phone in', 'whoosh', { len: 0.5, from: 300, to: 1400, gain: 0.08 });
    MSGS.forEach((m, i) => {
      if (m.who === 'out') {
        const n = Math.max(3, Math.round((m.at - m.type) * 9));
        for (let k = 0; k < n; k++) add(m.type + (k / n) * (m.at - m.type - 0.12), `type ${i}.${k}`, 'tick', { gain: 0.035 });
        add(m.at, `sent ${i + 1}`, 'blip', { pitch: 'A5', gain: 0.1 });
      } else add(m.at, `received ${i + 1}`, 'pop', { pitch: m.card ? 'D6' : 'F#5', gain: 0.13 });
    });
    add(TAP, 'tap', 'tok', { pitch: 'D5', gain: 0.14 });
    add(EXP0 + 0.05, 'card leaves the phone', 'whoosh', { len: 0.9, from: 300, to: 2200, gain: 0.14 });
    LOGO_DOTS.forEach((_, i) => add(EXP1 + 0.2 + i * 0.12, `logo dot ${i + 1}`, 'pop', { pitch: ['D5', 'F#5', 'A5', 'B5', 'D6'][i], gain: 0.08 }));
    return H.sort((a, b) => a[0] - b[0]);
  }

  // ------------------------------------------------------------------ boot + harness
  let ready = null;
  async function boot() {
    await document.fonts.load('400 40px "Varela Round"', 'אבג Abc 123');
    await document.fonts.ready;
    measure();
    window.HITS = hits();
    if (PREVIEW) document.body.classList.add('preview');
    fit();
    apply(0);
  }
  function fit() {
    if (RENDER) { stage.style.transform = 'none'; return; }
    const bar = PREVIEW ? 54 : 0;
    const sc = Math.min(innerWidth / SW, (innerHeight - bar) / SH);
    stage.style.transform = `translate(${(innerWidth - SW * sc) / 2}px, ${(innerHeight - bar - SH * sc) / 2}px) scale(${sc})`;
  }
  addEventListener('resize', fit);
  window.DURATION = DURATION;
  window.seek = async (t) => { await ready; apply(clamp(t, 0, DURATION)); };
  ready = boot().then(() => { window.filmReady = true; });

  if (PREVIEW) {
    const h = document.createElement('div');
    h.id = 'harness';
    h.innerHTML = `<button id="pp" type="button">❚❚</button><input id="scrub" type="range" min="0" max="${DURATION}" step="0.0167" value="0" aria-label="time"><span id="tc">0.00</span>`;
    document.body.appendChild(h);
    let playing = true, t0 = 0, start = performance.now();
    const scrub = h.querySelector('#scrub'), tc = h.querySelector('#tc'), pp = h.querySelector('#pp');
    const showT = (t) => { scrub.value = t; tc.textContent = t.toFixed(2); window.seek(t); };
    const loop = (now) => { if (!playing) return; showT((t0 + (now - start) / 1000) % DURATION); requestAnimationFrame(loop); };
    ready.then(() => { start = performance.now(); requestAnimationFrame(loop); });
    pp.onclick = () => { playing = !playing; pp.textContent = playing ? '❚❚' : '▶'; if (playing) { t0 = +scrub.value; start = performance.now(); requestAnimationFrame(loop); } };
    scrub.oninput = () => { playing = false; pp.textContent = '▶'; showT(+scrub.value); };
  }
})();

</script>
</body>
</html>
